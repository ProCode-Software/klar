name = "Klar"
grammar = "klar"
path_suffixes = ["klar"]
line_comments = ["//"]
block_comment = ["/*", "*/"]
tab_size = 4
hard_tabs = false
first_line_pattern = "^#!.*\\bklar\\b" # eg. #!/usr/bin/env klar
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = '"', end = '"', close = true, newline = false },
    { start = "'", end = "'", close = true, newline = false, not_in = [
        "comment",
        "string",
    ] },
    { start = "`", end = "`", close = true, newline = false },
    { start = "/*", end = " */", close = true, newline = false },
]
